<!doctype html>
<!-- tells the browser this is a modern HTML5 page -->
<html lang="en">
  <!-- root element; lang helps screen readers and translators -->
  <head>
    <!-- metadata that is not shown on the page -->
    <meta charset="UTF-8" />
    <!-- use UTF-8 so characters such as the rupee sign display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- makes the page scale properly on phones -->
    <title>Employee Management System - Day 5 (Trainer)</title>
    <!-- text shown in the browser tab -->
  </head>
  <body>
    <!-- everything visible lives in the body -->
    <div id="root"></div>
    <!-- React renders the whole application inside this empty div -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- load the app entry file as an ES module; Vite compiles it on the fly -->
  </body>
</html>
